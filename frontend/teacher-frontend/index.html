<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teacher-frontend</title>
    <script>
      let savedTheme = null
      try {
        savedTheme = localStorage.getItem('edutrack.theme')
      } catch {
        savedTheme = null
      }
      const systemTheme = typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme =
        savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : systemTheme
    </script>
    <style>
      html { color-scheme: light; background: #f4f7f6; }
      html[data-theme="dark"] { color-scheme: dark; background: #111b26; }
      body { background: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
