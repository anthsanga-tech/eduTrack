name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  admin-frontend:
    name: Admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-frontend
    env:
      VITE_API_URL: https://example-api.onrender.com/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  teacher-frontend:
    name: Teacher frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/teacher-frontend
    env:
      VITE_API_URL: https://example-api.onrender.com/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/teacher-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  student-frontend:
    name: Student frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/student-frontend
    env:
      VITE_API_URL: https://example-api.onrender.com/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/student-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
